<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- 40px Porcelain Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5EBE6" stroke-width="1" />
    </pattern>
    <filter id="soft-shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#25483C" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#F5F7F4" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Left Pill Badge: PORTFOLIO & CASE STUDIES -->
  <g transform="translate(72, 64)">
    <rect width="252" height="32" rx="16" fill="#DCE7DF" stroke="#D6DFD7" stroke-width="1" />
    <circle cx="22" cy="16" r="4.5" fill="#25483C" />
    <text x="36" y="20.5" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#25483C">PORTFOLIO &amp; CASE STUDIES</text>
  </g>

  <!-- Top Right Domain Label (Verified Production Domain) -->
  <text x="1128" y="85" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="0.2" fill="#69756D">mudassirdandor.vercel.app</text>

  <!-- Main Hero Title -->
  <text x="72" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.8" fill="#25483C">Mudassir Javed</text>

  <!-- Subheading -->
  <text x="72" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#26312B">Data Analyst — Business Intelligence &amp; Data Analytics</text>

  <!-- Professional Narrative Description -->
  <text x="72" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16.5" font-weight="400" fill="#69756D">
    <tspan x="72" dy="0">MSc in Statistics with practical experience across data analysis, structured intake automation,</tspan>
    <tspan x="72" dy="28">meteorological telemetry pipelines, and business intelligence.</tspan>
  </text>

  <!-- Horizontal Divider Line -->
  <line x1="72" y1="480" x2="1128" y2="480" stroke="#D6DFD7" stroke-width="1" />

  <!-- Bottom Chips: Analytical Capabilities & Degrees -->
  <!-- Chip 1: MSc Statistics -->
  <g transform="translate(72, 508)" filter="url(#soft-shadow)">
    <rect width="112" height="34" rx="8" fill="#FFFFFF" stroke="#D6DFD7" stroke-width="1" />
    <text x="56" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#26312B">MSc Statistics</text>
  </g>

  <!-- Chip 2: Business Intelligence -->
  <g transform="translate(196, 508)" filter="url(#soft-shadow)">
    <rect width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D6DFD7" stroke-width="1" />
    <text x="79" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#26312B">Business Intelligence</text>
  </g>

  <!-- Chip 3: SQL & Python -->
  <g transform="translate(366, 508)" filter="url(#soft-shadow)">
    <rect width="118" height="34" rx="8" fill="#FFFFFF" stroke="#D6DFD7" stroke-width="1" />
    <text x="59" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#26312B">SQL &amp; Python</text>
  </g>

  <!-- Chip 4: Data Ingestion & Automation -->
  <g transform="translate(496, 508)" filter="url(#soft-shadow)">
    <rect width="210" height="34" rx="8" fill="#FFFFFF" stroke="#D6DFD7" stroke-width="1" />
    <text x="105" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#26312B">Data Ingestion &amp; Automation</text>
  </g>

  <!-- Bottom Right Brand Signature -->
  <text x="1128" y="529" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.4" fill="#25483C">Porcelain + Deep Pine</text>
</svg>
